name: Release from CHANGELOG

# Triggers whenever CHANGELOG.md is pushed to the main branch.
# If the top versioned entry is new (no matching tag exists yet),
# waits for CI to pass on the same commit, then dispatches the release workflow.

on:
  push:
    branches: [main, master]
    paths:
      - CHANGELOG.md

jobs:
  detect-and-release:
    name: Detect new version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Parse the first versioned section in CHANGELOG.md.
      # We look for the pattern:  ## [X.Y.Z...] - YYYY-MM-DD
      # [Unreleased] is intentionally skipped.
      - name: Parse CHANGELOG version
        id: changelog
        run: |
          version=$(grep -oP '(?<=## \[)[\d]+\.[\d]+\.[\d]+[^\]]*(?=\])' CHANGELOG.md | head -1)

          if [[ -z "$version" ]]; then
            echo "No versioned entry found in CHANGELOG.md — skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "found=true"       >> "$GITHUB_OUTPUT"

      # Check whether a release for this version already exists.
      - name: Check if release already exists
        id: check
        if: steps.changelog.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          if git tag --list "$TAG" | grep -q .; then
            echo "Tag $TAG already exists — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      # Wait for the CI workflow to complete successfully on this exact commit.
      # Polls every 30 s for up to 15 minutes before giving up.
      - name: Wait for CI to pass
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Waiting for CI workflow to complete on $SHA..."
          deadline=$(( $(date +%s) + 900 ))

          while true; do
            status=$(gh api \
              "repos/$REPO/actions/runs?head_sha=$SHA&name=CI&per_page=10" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last | .conclusion // "pending"')

            echo "  CI status: $status"

            case "$status" in
              success)
                echo "CI passed — proceeding with release."
                break
                ;;
              failure|cancelled|timed_out|action_required|skipped)
                echo "CI did not pass (conclusion: $status) — aborting release."
                exit 1
                ;;
            esac

            if (( $(date +%s) >= deadline )); then
              echo "Timed out waiting for CI after 15 minutes — aborting."
              exit 1
            fi

            sleep 30
          done

      # Dispatch the release workflow with the detected version.
      - name: Dispatch release workflow
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          echo "Dispatching release workflow for version $VERSION"
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --field version="$VERSION" \
            --field skip_version_commit="true"
