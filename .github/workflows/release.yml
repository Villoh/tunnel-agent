name: Release

on:
  # Manual trigger only. prepare bumps version, commits, and pushes the tag.
  # The build matrix then checks out that tagged commit.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.5.0 or 0.5.0-rc.1)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ── Bump version, commit, push, create tag ────────────────────────────────
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          version="${version#v}"
          semver="${version%%-*}"
          is_prerelease=false
          [[ "$version" =~ -(rc|beta|alpha)\. ]] && is_prerelease=true
          echo "version=$version"             >> "$GITHUB_OUTPUT"
          echo "semver=$semver"               >> "$GITHUB_OUTPUT"
          echo "tag=v$version"                >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "Version: $version | Semver: $semver | Pre-release: $is_prerelease"

      - name: Bump version
        run: bash scripts/bump-version.sh "${{ steps.version.outputs.version }}"

      - name: Commit, tag and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet \
            && echo "Nothing to commit." \
            || git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.version.outputs.tag }}"

  # ── Per-platform build & package ──────────────────────────────────────────
  build:
    name: Build (${{ matrix.rid }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            channel: win-x64
            exe: TunnelAgent.exe
          - rid: win-arm64
            os: windows-latest
            channel: win-arm64
            exe: TunnelAgent.exe
          - rid: linux-x64
            os: ubuntu-latest
            channel: linux-x64
            exe: TunnelAgent
          - rid: linux-arm64
            os: ubuntu-latest
            channel: linux-arm64
            exe: TunnelAgent
          - rid: osx-x64
            os: macos-15-intel
            channel: osx-x64
            exe: TunnelAgent
          - rid: osx-arm64
            os: macos-latest
            channel: osx-arm64
            exe: TunnelAgent

    runs-on: ${{ matrix.os }}

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SEMVER: ${{ needs.prepare.outputs.semver }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      # Checkout the tagged commit — already has the bumped version in .csproj
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', '**/TunnelAgent.slnx') }}
          restore-keys: nuget-${{ matrix.rid }}-

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      - name: Restore
        run: dotnet restore TunnelAgent.slnx -r ${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish src/TunnelAgent.Avalonia/TunnelAgent.Avalonia.csproj
          --no-restore -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/publish

      # Plain, updater-free zip for package managers (Scoop). Built straight from
      # the publish output so it has no Velopack shim/Update.exe/.portable marker,
      # which keeps the in-app updater disabled and lets Scoop own updates.
      - name: Package plain zip for Scoop (Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/velopack | Out-Null
          Compress-Archive -Path artifacts/publish/* `
            -DestinationPath "artifacts/velopack/TunnelAgent-${env:SEMVER}-${{ matrix.channel }}-scoop.zip" `
            -Force

      - name: Package with Velopack (Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          vpk pack `
            --packId      TunnelAgent `
            --packTitle   TunnelAgent `
            --packVersion "${{ env.SEMVER }}" `
            --channel     "${{ matrix.channel }}" `
            --packDir     artifacts/publish `
            --mainExe     "${{ matrix.exe }}" `
            --icon        src/TunnelAgent.Avalonia/Assets/logo.ico `
            --noPortable  false `
            --outputDir   artifacts/velopack

      - name: Package with Velopack (Linux)
        if: startsWith(matrix.rid, 'linux-')
        run: |
          vpk pack \
            --packId      TunnelAgent \
            --packTitle   "Tunnel Agent" \
            --packVersion "${{ env.SEMVER }}" \
            --channel     "${{ matrix.channel }}" \
            --packDir     artifacts/publish \
            --mainExe     "${{ matrix.exe }}" \
            --icon        src/TunnelAgent.Avalonia/Assets/logo-256.png \
            --categories  Utility \
            --outputDir   artifacts/velopack

      - name: Package .deb and .rpm (Linux)
        if: startsWith(matrix.rid, 'linux-')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

          case "${{ matrix.rid }}" in
            linux-x64)   deb_arch=amd64; rpm_arch=x86_64; pkg_arch=x64 ;;
            linux-arm64) deb_arch=arm64; rpm_arch=aarch64; pkg_arch=arm64 ;;
          esac

          stage="$(mktemp -d)"
          install -d "$stage/opt/TunnelAgent"
          cp -r artifacts/publish/. "$stage/opt/TunnelAgent/"
          chmod +x "$stage/opt/TunnelAgent/${{ matrix.exe }}"

          install -d "$stage/usr/bin"
          ln -s "/opt/TunnelAgent/${{ matrix.exe }}" "$stage/usr/bin/tunnel-agent"

          install -d "$stage/usr/share/applications"
          cat > "$stage/usr/share/applications/tunnel-agent.desktop" <<EOF
          [Desktop Entry]
          Name=Tunnel Agent
          Comment=Desktop UI for CLIProxyAPI and Perplexity WebUI Scraper
          Exec=/opt/TunnelAgent/${{ matrix.exe }}
          Icon=tunnel-agent
          Terminal=false
          Type=Application
          Categories=Utility;Development;
          EOF

          install -d "$stage/usr/share/icons/hicolor/256x256/apps"
          cp src/TunnelAgent.Avalonia/Assets/logo-256.png "$stage/usr/share/icons/hicolor/256x256/apps/tunnel-agent.png"

          common=(
            -s dir -C "$stage"
            --name tunnel-agent
            --version "${SEMVER}"
            --license MIT
            --vendor Villoh
            --maintainer Villoh
            --url "https://github.com/${{ github.repository }}"
            --description "Desktop UI for CLIProxyAPI and Perplexity WebUI Scraper."
          )

          fpm "${common[@]}" -t deb -a "$deb_arch" \
            -p "artifacts/velopack/TunnelAgent-${SEMVER}-linux-${pkg_arch}.deb" opt usr
          fpm "${common[@]}" -t rpm -a "$rpm_arch" \
            -p "artifacts/velopack/TunnelAgent-${SEMVER}-linux-${pkg_arch}.rpm" opt usr

      - name: Package with Velopack (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          vpk pack \
            --packId      TunnelAgent \
            --packTitle   "Tunnel Agent" \
            --packVersion "${{ env.SEMVER }}" \
            --channel     "${{ matrix.channel }}" \
            --packDir     artifacts/publish \
            --mainExe     "${{ matrix.exe }}" \
            --icon        src/TunnelAgent.Avalonia/Assets/logo.icns \
            --bundleId    com.tunnelagent.app \
            --outputDir   artifacts/velopack

      - name: List artifacts
        shell: bash
        run: find artifacts/velopack -type f | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/velopack/
          retention-days: 1

  # ── Create GitHub Release with all platform artifacts ──────────────────────
  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SEMVER: ${{ needs.prepare.outputs.semver }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts/velopack
          merge-multiple: false

      - name: Rename distribution artifacts and update Velopack feeds
        run: |
          semver="${{ env.SEMVER }}"

          update_feed() {
            local feed="$1"
            local old_name="$2"
            local new_name="$3"
            [[ -f "$feed" ]] || return
            jq --arg old "$old_name" --arg new "$new_name" '
              def update:
                if type == "object" then
                  if has("FileName") and .FileName == $old then .FileName = $new else . end
                  | with_entries(.value |= update)
                elif type == "array" then map(update)
                else . end;
              update
            ' "$feed" > "$feed.tmp" && mv "$feed.tmp" "$feed"
          }

          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dir="artifacts/velopack/release-$rid"
            [[ -d "$dir" ]] || continue
            for f in "$dir"/*; do
              [[ -f "$f" ]] || continue
              base=$(basename "$f")
              [[ "$base" == *.nupkg ]] && continue
              [[ "$base" == releases.* ]] && continue
              [[ "$base" == assets.* ]] && continue
              [[ "$base" == RELEASES ]] && continue
              [[ "$base" == *"-$semver"* ]] && continue

              case "$rid" in
                linux-x64)
                  if [[ "$base" == *.AppImage ]]; then newname="TunnelAgent-${semver}-linux-x64.AppImage"
                  else continue
                  fi ;;
                linux-arm64)
                  if [[ "$base" == *.AppImage ]]; then newname="TunnelAgent-${semver}-linux-arm64.AppImage"
                  else continue
                  fi ;;
                osx-x64)
                  if [[ "$base" == *.pkg ]]; then newname="TunnelAgent-${semver}-osx-x64.pkg"
                  elif [[ "$base" == *.zip ]]; then newname="TunnelAgent-${semver}-osx-x64.zip"
                  else continue
                  fi ;;
                osx-arm64)
                  if [[ "$base" == *.pkg ]]; then newname="TunnelAgent-${semver}-osx-arm64.pkg"
                  elif [[ "$base" == *.zip ]]; then newname="TunnelAgent-${semver}-osx-arm64.zip"
                  else continue
                  fi ;;
                *) continue ;;
              esac

              mv "$f" "$dir/$newname"
              echo "Renamed: $base -> $newname"

              for feed in "$dir"/releases.*.json "$dir"/assets.*.json; do
                [[ -f "$feed" ]] || continue
                update_feed "$feed" "$base" "$newname"
              done
            done
          done

      - name: Generate latest.json
        run: |
          repo="${{ github.repository }}"
          base="https://github.com/$repo/releases/download/${{ env.TAG }}"
          semver="${{ env.SEMVER }}"

          entries=()
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dir="artifacts/velopack/release-$rid"
            [[ -d "$dir" ]] || continue

            installer=$(find "$dir" -maxdepth 1 \( -name "*Setup.exe" -o -name "*.AppImage" -o -name "*.pkg" \) | head -1)
            portable=$(find  "$dir" -maxdepth 1 \( -name "*portable.zip" -o -name "*.AppImage" -o -name "*.zip" \) \
              ! -name "*Setup*" ! -name "*.nupkg" ! -name "*-scoop.zip" | head -1)
            scoop=$(find "$dir" -maxdepth 1 -name "*-scoop.zip" | head -1)

            inst_json="null"
            port_json="null"
            scoop_json="null"
            [[ -n "$installer" ]] && {
              hash=$(sha256sum "$installer" | awk '{print $1}')
              name=$(basename "$installer")
              inst_json="{\"url\":\"$base/$name\",\"sha256\":\"$hash\"}"
            }
            [[ -n "$portable" ]] && {
              hash=$(sha256sum "$portable" | awk '{print $1}')
              name=$(basename "$portable")
              port_json="{\"url\":\"$base/$name\",\"sha256\":\"$hash\"}"
            }
            [[ -n "$scoop" ]] && {
              hash=$(sha256sum "$scoop" | awk '{print $1}')
              name=$(basename "$scoop")
              scoop_json="{\"url\":\"$base/$name\",\"sha256\":\"$hash\"}"
            }
            entries+=("\"$rid\":{\"installer\":$inst_json,\"portable\":$port_json,\"scoop\":$scoop_json}")
          done

          joined=$(IFS=,; echo "${entries[*]}")
          printf '{"version":"%s","tag":"%s","platforms":{%s}}\n' \
            "$semver" "${{ env.TAG }}" "$joined" \
            | python3 -m json.tool --indent 2 > artifacts/latest.json

          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Build release notes
        run: |
          awk -v version="${{ env.SEMVER }}" '
            $0 ~ "^## \\[" version "\\]" { p=1; next }
            p && $0 ~ "^## \\[" { exit }
            p { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > changelog_section.md

          [[ -s changelog_section.md ]] || { echo "No CHANGELOG section for ${{ env.SEMVER }}"; exit 1; }

          tag="${{ env.TAG }}"
          semver="${{ env.SEMVER }}"
          base="https://github.com/${{ github.repository }}/releases/download/$tag"

          win_x64_setup=$(find artifacts/velopack/release-win-x64 -maxdepth 1 -name "*Setup.exe" | head -1)
          win_x64_setup_name=$(basename "$win_x64_setup")
          win_x64_portable=$(find artifacts/velopack/release-win-x64 -maxdepth 1 \( -name "*portable.zip" -o -name "*.zip" \) ! -name "*Setup*" ! -name "*.nupkg" ! -name "*-scoop.zip" | head -1)
          win_x64_portable_name=$(basename "$win_x64_portable")

          win_arm64_setup=$(find artifacts/velopack/release-win-arm64 -maxdepth 1 -name "*Setup.exe" | head -1)
          win_arm64_setup_name=$(basename "$win_arm64_setup")
          win_arm64_portable=$(find artifacts/velopack/release-win-arm64 -maxdepth 1 \( -name "*portable.zip" -o -name "*.zip" \) ! -name "*Setup*" ! -name "*.nupkg" ! -name "*-scoop.zip" | head -1)
          win_arm64_portable_name=$(basename "$win_arm64_portable")

          {
            echo "## Installation"
            echo ""
            echo "| Platform | Installer | Portable |"
            echo "|----------|-----------|----------|"
            echo "| Windows x64 | [Setup.exe]($base/$win_x64_setup_name) | [.zip]($base/$win_x64_portable_name) |"
            echo "| Windows arm64 | [Setup.exe]($base/$win_arm64_setup_name) | [.zip]($base/$win_arm64_portable_name) |"
            echo "| Linux x64 | [.AppImage]($base/TunnelAgent-${semver}-linux-x64.AppImage) · [.deb]($base/TunnelAgent-${semver}-linux-x64.deb) · [.rpm]($base/TunnelAgent-${semver}-linux-x64.rpm) | — |"
            echo "| Linux arm64 | [.AppImage]($base/TunnelAgent-${semver}-linux-arm64.AppImage) · [.deb]($base/TunnelAgent-${semver}-linux-arm64.deb) · [.rpm]($base/TunnelAgent-${semver}-linux-arm64.rpm) | — |"
            echo "| macOS x64 (Intel) | [.pkg]($base/TunnelAgent-${semver}-osx-x64.pkg) | [.zip]($base/TunnelAgent-${semver}-osx-x64.zip) |"
            echo "| macOS arm64 (Apple Silicon) | [.pkg]($base/TunnelAgent-${semver}-osx-arm64.pkg) | [.zip]($base/TunnelAgent-${semver}-osx-arm64.zip) |"
            echo ""
            echo "> Existing installations update automatically via Velopack."
            echo ""
            echo "---"
            echo ""
            cat changelog_section.md
          } > release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Tunnel Agent ${{ env.VERSION }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          body_path: release_body.md
          files: |
            artifacts/velopack/release-win-x64/*
            artifacts/velopack/release-win-arm64/*
            artifacts/velopack/release-linux-x64/*
            artifacts/velopack/release-linux-arm64/*
            artifacts/velopack/release-osx-x64/*
            artifacts/velopack/release-osx-arm64/*
            artifacts/latest.json

      - name: Update Scoop bucket
        if: needs.prepare.outputs.is_prerelease == 'false'
        env:
          SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          scoop=$(find artifacts/velopack/release-win-x64 -name "*-scoop.zip" | head -1)
          hash=$(sha256sum "$scoop" | awk '{print $1}')
          name=$(basename "$scoop")
          base="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}"

          curl -sfL -X POST \
            -H "Authorization: Bearer $SCOOP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"event_type\":\"new-release\",\"client_payload\":{\"version\":\"${{ env.SEMVER }}\",\"url\":\"$base/$name\",\"sha256\":\"$hash\"}}" \
            "https://api.github.com/repos/Villoh/scoop-bucket/dispatches"
          echo "Scoop bucket notified for ${{ env.SEMVER }}"
