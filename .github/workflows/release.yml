name: Release

on:
  # Triggered automatically when a v* tag is pushed.
  # CI runs on the tag commit in parallel; this job waits for it to pass.
  push:
    tags: ["v*"]

  # Manual trigger (GitHub UI or changelog-release.yml).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.5.0 or 0.5.0-rc.1)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/TunnelAgent.slnx') }}
          restore-keys: nuget-

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      # ── Resolve version ────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}".TrimStart('v')
          } else {
            # push tag: github.ref_name is the tag name (e.g. "v0.4.0")
            $version = "${{ github.ref_name }}".TrimStart('v')
          }

          $semver = ($version -split '-')[0]
          $isPrerelease = $version -match '-(rc|beta|alpha)\.'

          "version=$version"       >> $env:GITHUB_OUTPUT
          "semver=$semver"         >> $env:GITHUB_OUTPUT
          "tag=v$version"          >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version  |  Semver: $semver  |  Pre-release: $isPrerelease"

      # ── Wait for CI to pass on this commit (tag push only) ─────────────────
      # CI triggers on the same tag push in parallel; wait for it before building.
      - name: Wait for CI to pass
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Waiting for CI workflow to complete on $SHA..."
          deadline=$(( $(date +%s) + 900 ))

          while true; do
            status=$(gh api \
              "repos/$REPO/actions/runs?head_sha=$SHA&name=CI&per_page=10" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last | .conclusion // "pending"')

            echo "  CI status: $status"

            case "$status" in
              success)
                echo "CI passed — proceeding with release."
                break
                ;;
              failure|cancelled|timed_out|action_required|skipped)
                echo "CI did not pass (conclusion: $status) — aborting release."
                exit 1
                ;;
            esac

            if (( $(date +%s) >= deadline )); then
              echo "Timed out waiting for CI after 15 minutes — aborting."
              exit 1
            fi

            sleep 30
          done

      # ── Bump .csproj files ─────────────────────────────────────────────────
      - name: Bump version in .csproj files
        shell: pwsh
        run: .\scripts\bump-version.ps1 -Version "${{ steps.version.outputs.version }}"

      # ── Restore ───────────────────────────────────────────────────────────
      - name: Restore
        run: dotnet restore TunnelAgent.slnx -r win-x64

      # ── Publish self-contained multi-file (for Velopack installer) ─────────
      - name: Publish
        run: >
          dotnet publish src/TunnelAgent.Avalonia/TunnelAgent.Avalonia.csproj
          --no-restore -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/publish

      # ── Publish portable (self-contained single exe, ~110 MB) ─────────────
      - name: Publish portable
        run: >
          dotnet publish src/TunnelAgent.Avalonia/TunnelAgent.Avalonia.csproj
          --no-restore -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/portable

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.semver }}"
          $dest = "artifacts/velopack/TunnelAgent-$version-win-x64-portable.zip"
          New-Item -ItemType Directory -Force -Path artifacts/velopack | Out-Null
          Compress-Archive -Path artifacts/portable/TunnelAgent.exe -DestinationPath $dest
          Write-Host "Created $dest"

      # ── Package with Velopack ─────────────────────────────────────────────
      - name: Package with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId    TunnelAgent `
            --packTitle "Tunnel Agent" `
            --packVersion "${{ steps.version.outputs.semver }}" `
            --packDir  artifacts/publish `
            --mainExe  TunnelAgent.exe `
            --icon     src/TunnelAgent.Avalonia/Assets/logo.ico `
            --outputDir artifacts/velopack `
            --noPortable

      - name: List Velopack artifacts
        shell: pwsh
        run: Get-ChildItem artifacts/velopack | Select-Object Name, Length

      # ── Generate latest.json ──────────────────────────────────────────────
      - name: Generate latest.json
        shell: pwsh
        run: |
          $tag     = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.semver }}"
          $repo    = "${{ github.repository }}"
          $base    = "https://github.com/$repo/releases/download/$tag"

          $setupExe  = Get-ChildItem artifacts/velopack -Filter "*-win-Setup.exe" | Select-Object -First 1
          $portable  = Get-ChildItem artifacts/velopack -Filter "*-win-x64-portable.zip" | Select-Object -First 1

          $setupHash    = (Get-FileHash $setupExe.FullName  -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portable.FullName  -Algorithm SHA256).Hash.ToLower()

          @{
            version   = $version
            tag       = $tag
            installer = @{
              url    = "$base/$($setupExe.Name)"
              sha256 = $setupHash
            }
            portable  = @{
              url    = "$base/$($portable.Name)"
              sha256 = $portableHash
            }
          } | ConvertTo-Json -Depth 3 | Set-Content artifacts/velopack/latest.json -Encoding UTF8

          Write-Host "Generated latest.json:"
          Get-Content artifacts/velopack/latest.json

      # ── Create tag (workflow_dispatch only) ───────────────────────────────
      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (git tag -l $tag) {
            Write-Host "Tag $tag already exists, skipping."
          } else {
            git tag -a $tag -m "Release $tag"
            git push origin $tag
            Write-Host "Pushed tag $tag"
          }

      # ── Commit bumped .csproj files back to branch ────────────────────────
      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $changed = git diff --name-only
          if (-not $changed) { Write-Host "Nothing to commit."; exit 0 }

          git add **/*.csproj
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $branch = "${{ github.ref_name }}"
          } else {
            $branch = git branch -r --contains HEAD |
              Select-String 'origin/(main|master)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } |
              Select-Object -First 1
            if (-not $branch) { $branch = "main" }
          }

          git push origin "HEAD:refs/heads/$branch"
          Write-Host "Pushed version bump to $branch"

      # ── Extract changelog section for this version ───────────────────────
      - name: Build release notes from CHANGELOG
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.semver }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          awk "/^## \\[$VERSION\\]/,/^## \\[/" CHANGELOG.md \
            | sed '1d;$d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > /tmp/changelog_section.md

          previous_tag=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)
          range=""
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$TAG"
          else
            range="$TAG"
          fi

          {
            echo "## Installation"
            echo ""
            echo "**Fresh install:** download and run \`TunnelAgent-${VERSION}-win-Setup.exe\`."
            echo ""
            echo "**Requirements:** Windows 10 or later."
            echo ""
            echo "> Existing installations update automatically — no manual download needed."
            echo ""
            echo "---"
            echo ""
            cat /tmp/changelog_section.md
            echo ""
            echo "### Contributors"
            echo ""
            git log --format='- %aN' "$range" | sort -u || true
            echo ""
            if [ -n "$previous_tag" ]; then
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${previous_tag}...${TAG}"
            fi
          } > /tmp/release_body.md

      # ── Publish GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tunnel Agent ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          append_body: true
          body_path: /tmp/release_body.md
          files: |
            artifacts/velopack/*.exe
            artifacts/velopack/*.nupkg
            artifacts/velopack/*.zip
            artifacts/velopack/RELEASES
            artifacts/velopack/releases.win.json
            artifacts/velopack/assets.win.json
            artifacts/velopack/latest.json

      # ── Notify Scoop bucket (stable releases only) ────────────────────────
      - name: Update Scoop bucket
        if: steps.version.outputs.is_prerelease == 'false'
        shell: pwsh
        env:
          SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.semver }}"
          $tag     = "${{ steps.version.outputs.tag }}"
          $repo    = "${{ github.repository }}"
          $base    = "https://github.com/$repo/releases/download/$tag"

          $portable     = Get-ChildItem artifacts/velopack -Filter "*-win-x64-portable.zip" | Select-Object -First 1
          $portableHash = (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLower()

          $body = @{
            event_type     = "new-release"
            client_payload = @{
              version  = $version
              url      = "$base/$($portable.Name)"
              sha256   = $portableHash
            }
          } | ConvertTo-Json -Depth 3

          $headers = @{
            Authorization = "Bearer $env:SCOOP_TOKEN"
            Accept        = "application/vnd.github+json"
          }

          Invoke-RestMethod `
            -Uri     "https://api.github.com/repos/Villoh/scoop-bucket/dispatches" `
            -Method  POST `
            -Headers $headers `
            -Body    $body `
            -ContentType "application/json"

          Write-Host "Dispatched new-release event to scoop-bucket for $version"
