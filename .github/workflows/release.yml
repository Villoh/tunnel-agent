name: Release

on:
  # Triggered automatically when a v* tag is pushed.
  # CI runs on the tag commit in parallel; this job waits for it to pass.
  push:
    tags: ["v*"]

  # Manual trigger (GitHub UI or changelog-release.yml).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.5.0 or 0.5.0-rc.1)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ── Resolve version + wait for CI ─────────────────────────────────────────
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${{ github.ref_name }}"
          fi
          version="${version#v}"
          semver="${version%%-*}"
          is_prerelease=false
          [[ "$version" =~ -(rc|beta|alpha)\. ]] && is_prerelease=true
          echo "version=$version"             >> "$GITHUB_OUTPUT"
          echo "semver=$semver"               >> "$GITHUB_OUTPUT"
          echo "tag=v$version"                >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "Version: $version | Semver: $semver | Pre-release: $is_prerelease"

      - name: Wait for CI to pass
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Waiting for CI workflow on $SHA..."
          deadline=$(( $(date +%s) + 900 ))
          while true; do
            status=$(gh api \
              "repos/$REPO/actions/runs?head_sha=$SHA&name=CI&per_page=10" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last | .conclusion // "pending"')
            echo "  CI status: $status"
            case "$status" in
              success) echo "CI passed."; break ;;
              failure|cancelled|timed_out|action_required|skipped)
                echo "CI did not pass ($status) — aborting."; exit 1 ;;
            esac
            (( $(date +%s) >= deadline )) && { echo "Timed out."; exit 1; }
            sleep 30
          done

  # ── Per-platform build & package ──────────────────────────────────────────
  build:
    name: Build (${{ matrix.rid }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            channel: win-x64
            exe: TunnelAgent.exe
          - rid: win-arm64
            os: windows-latest
            channel: win-arm64
            exe: TunnelAgent.exe
          - rid: linux-x64
            os: ubuntu-latest
            channel: linux-x64
            exe: TunnelAgent
          - rid: linux-arm64
            os: ubuntu-latest
            channel: linux-arm64
            exe: TunnelAgent
          - rid: osx-x64
            os: macos-15-intel
            channel: osx-x64
            exe: TunnelAgent
          - rid: osx-arm64
            os: macos-latest
            channel: osx-arm64
            exe: TunnelAgent

    runs-on: ${{ matrix.os }}

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SEMVER: ${{ needs.prepare.outputs.semver }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', '**/TunnelAgent.slnx') }}
          restore-keys: nuget-${{ matrix.rid }}-

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      # ── Version bump ────────────────────────────────────────────────────────
      - name: Bump version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\bump-version.ps1 -Version "${{ env.VERSION }}"

      - name: Bump version (Unix)
        if: runner.os != 'Windows'
        run: |
          find . -name "*.csproj" ! -name "TunnelAgent.Tests.csproj" \
            ! -path "*/obj/*" ! -path "*/bin/*" | while read f; do
            sed -i.bak \
              -e "s|<Version>[^<]*</Version>|<Version>${{ env.VERSION }}</Version>|g" \
              -e "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>${{ env.SEMVER }}.0</AssemblyVersion>|g" \
              -e "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>${{ env.SEMVER }}.0</FileVersion>|g" \
              "$f" && rm -f "$f.bak"
          done

      # ── Restore & publish ───────────────────────────────────────────────────
      - name: Restore
        run: dotnet restore TunnelAgent.slnx -r ${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish src/TunnelAgent.Avalonia/TunnelAgent.Avalonia.csproj
          --no-restore -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/publish

      # ── Package with Velopack ───────────────────────────────────────────────
      # Windows: produces Setup.exe + .nupkg + RELEASES + portable .zip (via --noPortable=false)
      - name: Package with Velopack (Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          vpk pack `
            --packId      TunnelAgent `
            --packTitle   "Tunnel Agent" `
            --packVersion "${{ env.SEMVER }}" `
            --channel     "${{ matrix.channel }}" `
            --packDir     artifacts/publish `
            --mainExe     "${{ matrix.exe }}" `
            --icon        src/TunnelAgent.Avalonia/Assets/logo.ico `
            --outputDir   artifacts/velopack

      # Linux: produces a single .AppImage — that IS the installer and the portable.
      # --icon must be a PNG file.
      - name: Package with Velopack (Linux)
        if: startsWith(matrix.rid, 'linux-')
        run: |
          vpk pack \
            --packId      TunnelAgent \
            --packTitle   "Tunnel Agent" \
            --packVersion "${{ env.SEMVER }}" \
            --channel     "${{ matrix.channel }}" \
            --packDir     artifacts/publish \
            --mainExe     "${{ matrix.exe }}" \
            --icon        src/TunnelAgent.Avalonia/Assets/logo-256.png \
            --categories  Utility \
            --outputDir   artifacts/velopack

      # macOS: produces a .pkg installer and a portable .zip of the .app bundle.
      # --icon must be a .icns file (generated above).
      # --bundleId sets the CFBundleIdentifier in Info.plist.
      - name: Package with Velopack (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          vpk pack \
            --packId      TunnelAgent \
            --packTitle   "Tunnel Agent" \
            --packVersion "${{ env.SEMVER }}" \
            --channel     "${{ matrix.channel }}" \
            --packDir     artifacts/publish \
            --mainExe     "${{ matrix.exe }}" \
            --icon        src/TunnelAgent.Avalonia/Assets/logo.icns \
            --bundleId    com.tunnelagent.app \
            --outputDir   artifacts/velopack

      - name: List artifacts
        shell: bash
        run: find artifacts/velopack -type f | sort

      - name: Upload bumped csproj
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: bumped-csproj
          path: "**/*.csproj"
          retention-days: 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/velopack/
          retention-days: 1

  # ── Create GitHub Release with all platform artifacts ──────────────────────
  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SEMVER: ${{ needs.prepare.outputs.semver }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bumped csproj
        uses: actions/download-artifact@v4
        with:
          name: bumped-csproj
          path: .
          merge-multiple: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/velopack
          merge-multiple: false

      - name: Rename distribution artifacts and update Velopack feeds
        run: |
          semver="${{ env.SEMVER }}"

          update_feed() {
            local feed="$1"
            local old_name="$2"
            local new_name="$3"
            [[ -f "$feed" ]] || return
            jq --arg old "$old_name" --arg new "$new_name" '
              def update:
                if type == "object" then
                  if has("FileName") and .FileName == $old then .FileName = $new else . end
                  | with_entries(.value |= update)
                elif type == "array" then map(update)
                else . end;
              update
            ' "$feed" > "$feed.tmp" && mv "$feed.tmp" "$feed"
          }

          # Only rename Linux/macOS where filenames collide across RIDs.
          # Windows names already include the channel (win) so they are unique.
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dir="artifacts/velopack/release-$rid"
            [[ -d "$dir" ]] || continue
            for f in "$dir"/*; do
              [[ -f "$f" ]] || continue
              base=$(basename "$f")
              # Skip feeds, nupkg, RELEASES — referenced by Velopack updater
              [[ "$base" == *.nupkg ]] && continue
              [[ "$base" == releases.* ]] && continue
              [[ "$base" == assets.* ]] && continue
              [[ "$base" == RELEASES ]] && continue
              [[ "$base" == *"-$semver"* ]] && continue

              case "$rid" in
                linux-x64)
                  if [[ "$base" == *.AppImage ]]; then newname="TunnelAgent-${semver}-linux-x64.AppImage"
                  else continue
                  fi ;;
                linux-arm64)
                  if [[ "$base" == *.AppImage ]]; then newname="TunnelAgent-${semver}-linux-arm64.AppImage"
                  else continue
                  fi ;;
                osx-x64)
                  if [[ "$base" == *.pkg ]]; then newname="TunnelAgent-${semver}-osx-x64.pkg"
                  elif [[ "$base" == *.zip ]]; then newname="TunnelAgent-${semver}-osx-x64.zip"
                  else continue
                  fi ;;
                osx-arm64)
                  if [[ "$base" == *.pkg ]]; then newname="TunnelAgent-${semver}-osx-arm64.pkg"
                  elif [[ "$base" == *.zip ]]; then newname="TunnelAgent-${semver}-osx-arm64.zip"
                  else continue
                  fi ;;
                *) continue ;;
              esac

              mv "$f" "$dir/$newname"
              echo "Renamed: $base -> $newname"

              for feed in "$dir"/releases.*.json "$dir"/assets.*.json; do
                [[ -f "$feed" ]] || continue
                update_feed "$feed" "$base" "$newname"
              done
            done
          done

      - name: Generate latest.json
        run: |
          repo="${{ github.repository }}"
          base="https://github.com/$repo/releases/download/${{ env.TAG }}"
          semver="${{ env.SEMVER }}"

          entries=()
          for rid in win-x64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dir="artifacts/velopack/release-$rid"
            [[ -d "$dir" ]] || continue

            # Windows: Setup.exe = installer, *-portable.zip = portable
            # Linux:   .AppImage = both installer and portable (same file)
            # macOS:   .pkg = installer, .zip = portable .app bundle
            installer=$(find "$dir" -maxdepth 1 \( -name "*Setup.exe" -o -name "*.AppImage" -o -name "*.pkg" \) | head -1)
            portable=$(find  "$dir" -maxdepth 1 \( -name "*portable.zip" -o -name "*.AppImage" -o -name "*.zip" \) \
              ! -name "*Setup*" ! -name "*.nupkg" | head -1)

            inst_json="null"
            port_json="null"
            [[ -n "$installer" ]] && {
              hash=$(sha256sum "$installer" | awk '{print $1}')
              name=$(basename "$installer")
              inst_json="{\"url\":\"$base/$name\",\"sha256\":\"$hash\"}"
            }
            [[ -n "$portable" ]] && {
              hash=$(sha256sum "$portable" | awk '{print $1}')
              name=$(basename "$portable")
              port_json="{\"url\":\"$base/$name\",\"sha256\":\"$hash\"}"
            }
            entries+=("\"$rid\":{\"installer\":$inst_json,\"portable\":$port_json}")
          done

          joined=$(IFS=,; echo "${entries[*]}")
          printf '{"version":"%s","tag":"%s","platforms":{%s}}\n' \
            "$semver" "${{ env.TAG }}" "$joined" \
            | python3 -m json.tool --indent 2 > artifacts/latest.json

          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ env.TAG }}"
          if git tag -l "$tag" | grep -q .; then
            echo "Tag $tag already exists, skipping."
          else
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only | grep -q . || { echo "Nothing to commit."; exit 0; }
          git add "**/*.csproj"
          git commit -m "chore: bump version to ${{ env.VERSION }} [skip ci]"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            branch="${{ github.ref_name }}"
          else
            branch=$(git branch -r --contains HEAD | grep -oE '(main|master)' | head -1 || echo "main")
          fi
          git push origin "HEAD:refs/heads/$branch"

      - name: Build release notes
        run: |
          awk -v version="${{ env.SEMVER }}" '
            $0 ~ "^## \\[" version "\\]" { p=1; next }
            p && $0 ~ "^## \\[" { exit }
            p { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > changelog_section.md

          [[ -s changelog_section.md ]] || { echo "No CHANGELOG section for ${{ env.SEMVER }}"; exit 1; }

          tag="${{ env.TAG }}"
          semver="${{ env.SEMVER }}"
          base="https://github.com/${{ github.repository }}/releases/download/$tag"

          # Resolve actual Windows artifact names (Velopack-generated, not renamed)
          win_x64_setup=$(find artifacts/velopack/release-win-x64 -maxdepth 1 -name "*Setup.exe" | head -1)
          win_x64_setup_name=$(basename "$win_x64_setup")
          win_x64_portable=$(find artifacts/velopack/release-win-x64 -maxdepth 1 -name "*portable.zip" | head -1)
          win_x64_portable_name=$(basename "$win_x64_portable")

          win_arm64_setup=$(find artifacts/velopack/release-win-arm64 -maxdepth 1 -name "*Setup.exe" | head -1)
          win_arm64_setup_name=$(basename "$win_arm64_setup")
          win_arm64_portable=$(find artifacts/velopack/release-win-arm64 -maxdepth 1 -name "*portable.zip" | head -1)
          win_arm64_portable_name=$(basename "$win_arm64_portable")

          {
            echo "## Installation"
            echo ""
            echo "| Platform | Installer | Portable |"
            echo "|----------|-----------|----------|"
            echo "| Windows x64 | [Setup.exe]($base/$win_x64_setup_name) | [.zip]($base/$win_x64_portable_name) |"
            echo "| Windows arm64 | [Setup.exe]($base/$win_arm64_setup_name) | [.zip]($base/$win_arm64_portable_name) |"
            echo "| Linux x64 | [.AppImage]($base/TunnelAgent-${semver}-linux-x64.AppImage) | — |"
            echo "| Linux arm64 | [.AppImage]($base/TunnelAgent-${semver}-linux-arm64.AppImage) | — |"
            echo "| macOS x64 (Intel) | [.pkg]($base/TunnelAgent-${semver}-osx-x64.pkg) | [.zip]($base/TunnelAgent-${semver}-osx-x64.zip) |"
            echo "| macOS arm64 (Apple Silicon) | [.pkg]($base/TunnelAgent-${semver}-osx-arm64.pkg) | [.zip]($base/TunnelAgent-${semver}-osx-arm64.zip) |"
            echo ""
            echo "> Existing installations update automatically via Velopack."
            echo ""
            echo "---"
            echo ""
            cat changelog_section.md
          } > release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Tunnel Agent ${{ env.VERSION }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          body_path: release_body.md
          files: |
            artifacts/velopack/release-win-x64/*
            artifacts/velopack/release-linux-x64/*
            artifacts/velopack/release-linux-arm64/*
            artifacts/velopack/release-osx-x64/*
            artifacts/velopack/release-osx-arm64/*
            artifacts/latest.json

      # Notify Scoop bucket (Windows portable, stable releases only)
      - name: Update Scoop bucket
        if: needs.prepare.outputs.is_prerelease == 'false'
        env:
          SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          portable=$(find artifacts/velopack/release-win-x64 -name "*portable.zip" | head -1)
          hash=$(sha256sum "$portable" | awk '{print $1}')
          name=$(basename "$portable")
          base="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}"

          curl -sfL -X POST \
            -H "Authorization: Bearer $SCOOP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"event_type\":\"new-release\",\"client_payload\":{\"version\":\"${{ env.SEMVER }}\",\"url\":\"$base/$name\",\"sha256\":\"$hash\"}}" \
            "https://api.github.com/repos/Villoh/scoop-bucket/dispatches"
          echo "Scoop bucket notified for ${{ env.SEMVER }}"
