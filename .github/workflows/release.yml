name: Release

on:
  # Triggered automatically after CI passes on a tag commit.
  workflow_run:
    workflows: [CI]
    types: [completed]

  # Manual trigger (GitHub UI or changelog-release.yml).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.5.0 or 0.5.0-rc.1)"
        required: true
        type: string
      # Internal: set to 'true' by changelog-release.yml so the version-bump
      # commit is skipped (CHANGELOG already updated the branch).
      skip_version_commit:
        description: "Skip committing version bump back to branch (internal)"
        required: false
        default: "false"
        type: string

jobs:
  release:
    name: Build & Publish
    runs-on: windows-2025
    permissions:
      contents: write

    # workflow_run: only proceed when CI succeeded on a tag push.
    # workflow_dispatch: always proceed (manual / changelog trigger).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # For workflow_run, check out the exact commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/TunnelAgent.slnx') }}
          restore-keys: nuget-

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      # ── Resolve version ────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}".TrimStart('v')
          } else {
            # workflow_run: head_branch contains the tag name (e.g. "v0.4.0")
            $version = "${{ github.event.workflow_run.head_branch }}".TrimStart('v')
          }

          $semver = ($version -split '-')[0]
          $isPrerelease = $version -match '-(rc|beta|alpha)\.'

          "version=$version"       >> $env:GITHUB_OUTPUT
          "semver=$semver"         >> $env:GITHUB_OUTPUT
          "tag=v$version"          >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version  |  Semver: $semver  |  Pre-release: $isPrerelease"

      # ── Bump .csproj files ─────────────────────────────────────────────────
      - name: Bump version in .csproj files
        shell: pwsh
        run: .\scripts\bump-version.ps1 -Version "${{ steps.version.outputs.version }}"

      # ── Restore ───────────────────────────────────────────────────────────
      - name: Restore
        run: dotnet restore TunnelAgent.slnx -r win-x64

      # ── Publish self-contained win-x64 ────────────────────────────────────
      - name: Publish
        run: >
          dotnet publish src/TunnelAgent.Avalonia/TunnelAgent.Avalonia.csproj
          --no-restore -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o artifacts/publish

      # ── Portable zip ──────────────────────────────────────────────────────
      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.semver }}"
          $dest = "artifacts/velopack/TunnelAgent-$version-win-x64-portable.zip"
          New-Item -ItemType Directory -Force -Path artifacts/velopack | Out-Null
          Compress-Archive -Path artifacts/publish/* -DestinationPath $dest
          Write-Host "Created $dest"

      # ── Package with Velopack ─────────────────────────────────────────────
      - name: Package with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId   TunnelAgent `
            --packVersion "${{ steps.version.outputs.semver }}" `
            --packDir  artifacts/publish `
            --mainExe  TunnelAgent.exe `
            --icon     src/TunnelAgent.Avalonia/Assets/logo.ico `
            --outputDir artifacts/velopack

      # ── Generate latest.json ──────────────────────────────────────────────
      # Simple metadata file consumed by Scoop autoupdate and other tooling.
      - name: Generate latest.json
        shell: pwsh
        run: |
          $tag     = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.semver }}"
          $repo    = "${{ github.repository }}"
          $base    = "https://github.com/$repo/releases/download/$tag"

          $setupExe = Get-ChildItem artifacts/velopack -Filter "*-win-Setup.exe" |
                        Select-Object -First 1

          $hash = (Get-FileHash $setupExe.FullName -Algorithm SHA256).Hash.ToLower()

          @{
            version  = $version
            tag      = $tag
            installer = @{
              url    = "$base/$($setupExe.Name)"
              sha256 = $hash
            }
          } | ConvertTo-Json -Depth 3 | Set-Content artifacts/velopack/latest.json -Encoding UTF8

          Write-Host "Generated latest.json:"
          Get-Content artifacts/velopack/latest.json

      # ── Create tag (workflow_dispatch only) ───────────────────────────────
      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (git tag -l $tag) {
            Write-Host "Tag $tag already exists, skipping."
          } else {
            git tag -a $tag -m "Release $tag"
            git push origin $tag
            Write-Host "Pushed tag $tag"
          }

      # ── Commit bumped .csproj files back to branch ────────────────────────
      - name: Commit version bump
        if: github.event.inputs.skip_version_commit != 'true'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $changed = git diff --name-only
          if (-not $changed) { Write-Host "Nothing to commit."; exit 0 }

          git add **/*.csproj
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $branch = "${{ github.ref_name }}"
          } else {
            $branch = git branch -r --contains HEAD |
              Select-String 'origin/(main|master)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } |
              Select-Object -First 1
            if (-not $branch) { $branch = "main" }
          }

          git push origin "HEAD:refs/heads/$branch"
          Write-Host "Pushed version bump to $branch"

      # ── Publish GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TunnelAgent ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          append_body: true
          body: |

            ## Installation

            **Fresh install:** download and run `TunnelAgent-${{ steps.version.outputs.semver }}-win-Setup.exe`.

            **Requirements:** Windows 10 or later.

            > Existing installations update automatically — no manual download needed.
          files: |
            artifacts/velopack/*.exe
            artifacts/velopack/*.nupkg
            artifacts/velopack/*.zip
            artifacts/velopack/RELEASES-win
            artifacts/velopack/latest.json

      # ── Notify Scoop bucket (stable releases only) ────────────────────────
      - name: Update Scoop bucket
        if: steps.version.outputs.is_prerelease == 'false'
        shell: pwsh
        env:
          SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.semver }}"
          $tag     = "${{ steps.version.outputs.tag }}"
          $repo    = "${{ github.repository }}"
          $base    = "https://github.com/$repo/releases/download/$tag"

          $setupExe = Get-ChildItem artifacts/velopack -Filter "*-win-Setup.exe" |
                        Select-Object -First 1
          $hash = (Get-FileHash $setupExe.FullName -Algorithm SHA256).Hash.ToLower()

          $body = @{
            event_type     = "new-release"
            client_payload = @{
              version  = $version
              url      = "$base/$($setupExe.Name)"
              sha256   = $hash
            }
          } | ConvertTo-Json -Depth 3

          $headers = @{
            Authorization = "Bearer $env:SCOOP_TOKEN"
            Accept        = "application/vnd.github+json"
          }

          Invoke-RestMethod `
            -Uri     "https://api.github.com/repos/Villoh/scoop-bucket/dispatches" `
            -Method  POST `
            -Headers $headers `
            -Body    $body `
            -ContentType "application/json"

          Write-Host "Dispatched new-release event to scoop-bucket for $version"
