name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CHANGELOG.md"
      - "LICENSE"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CHANGELOG.md"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/TunnelAgent.slnx') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore TunnelAgent.slnx

      - name: Build
        run: dotnet build TunnelAgent.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test tests/TunnelAgent.Tests/TunnelAgent.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
